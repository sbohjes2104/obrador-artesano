{% extends 'base.html' %}
{% load static %}

{% block title %}Iniciar Sesión - Obrador Artesano{% endblock %}

{% block content %}
<section class="form-container">
    <h2 class="form-title">Iniciar Sesión</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Email</label>
            <input type="email" name="username" id="username" class="form-input" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <button type="submit" class="btn-pill">Entrar</button>
        </div>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <p>¿No tienes cuenta? <a href="{% url 'register' %}" style="color: var(--primary-dark); font-weight: bold;">Crea una aquí</a></p>
        </div>
    </form>
</section>
{% endblock %}
