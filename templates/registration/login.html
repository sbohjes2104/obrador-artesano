{% extends 'base.html' %}
{% load static %}

{% block title %}Iniciar Sesión - Obrador Artesano{% endblock %}

{% block content %}
<section class="auth-page-container">
    <div class="auth-wrapper">
        <div class="auth-logo">
            <img src="{% static 'images/logo.png' %}" alt="Obrador Logo">
        </div>

        <h2 class="auth-title">Iniciar Sesión</h2>

        <div class="auth-card">
            <form method="post">
                {% csrf_token %}
                <div class="auth-form-group">
                    <label for="username">Correo electrónico</label>
                    <input type="email" name="username" id="username" class="auth-form-input" placeholder="Introduce tu correo electrónico" required>
                </div>
                <div class="auth-form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" class="auth-form-input" placeholder="Escribe tu contraseña" required>
                </div>
                
                <div class="auth-btn-container">
                    <button type="submit" class="auth-btn">Iniciar sesión</button>
                </div>
            </form>
        </div>

        <div class="auth-footer">
            <p>¿No tienes cuenta? <a href="{% url 'register' %}">Crea una aquí</a></p>
        </div>
    </div>
</section>
{% endblock %}
