{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Artesanía en cada bocado{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <a href="{% url 'home' %}" class="logo">
                <img src="{% static 'images/logo.png' %}" alt="Obrador Logo">
            </a>
        </div>
        <div class="nav-right">
            <a href="#" class="icon-badge">
                <i class="fas fa-shopping-cart fa-lg"></i>
                <span class="badge">0</span>
            </a>
            <a href="{% url 'login' %}">
                <i class="fas fa-user fa-lg"></i>
            </a>
            <a href="#">
                <i class="fas fa-bars fa-lg"></i>
            </a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Obrador Artesano</p>
            <div class="footer-logo">
                <img src="{% static 'images/logo.png' %}" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <div class="social-icons">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
