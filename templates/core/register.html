{% extends 'base.html' %}
{% load static %}

{% block title %}Crear Cuenta - Obrador Artesano{% endblock %}

{% block content %}
<section class="auth-page-container">
    <div class="auth-wrapper">
        <div class="auth-logo">
            <img src="{% static 'images/logo.png' %}" alt="Obrador Logo">
        </div>

        <h2 class="auth-title">Crear Cuenta</h2>

        <div class="auth-card">
            <form method="post">
                {% csrf_token %}
                <div class="auth-form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" class="auth-form-input" placeholder="Tu nombre completo" required>
                </div>
                <div class="auth-form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" class="auth-form-input" placeholder="Introduce tu correo electrónico" required>
                </div>
                <div class="auth-form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" class="auth-form-input" placeholder="Escribe tu contraseña" required>
                </div>
                <div class="auth-form-group">
                    <label for="password_confirm">Repetir Contraseña</label>
                    <input type="password" name="password_confirm" id="password_confirm" class="auth-form-input" placeholder="Repite tu contraseña" required>
                </div>
                
                <div class="auth-btn-container">
                    <button type="submit" class="auth-btn">Registrarse</button>
                </div>
            </form>
        </div>

        <div class="auth-footer">
            <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Iniciar sesión</a></p>
        </div>
    </div>
</section>
{% endblock %}
