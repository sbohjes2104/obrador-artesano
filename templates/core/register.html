{% extends 'base.html' %}
{% load static %}

{% block title %}Crear Cuenta - Obrador Artesano{% endblock %}

{% block content %}
<section class="auth-page-container">
    <div class="auth-wrapper">
        <div class="auth-logo">
            <img src="{% static 'images/logo.png' %}" alt="Obrador Logo">
        </div>

        <h2 class="auth-title">Crear Cuenta</h2>

        <div class="auth-card">
            {% if messages %}
                <div class="auth-messages" style="margin-bottom: 1rem;">
                    {% for message in messages %}
                        <div class="auth-msg {% if message.tags %}{{ message.tags }}{% endif %}" style="background-color: {% if message.tags == 'error' %}#f8d7da{% else %}#d4edda{% endif %}; color: {% if message.tags == 'error' %}#721c24{% else %}#155724{% endif %}; padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; text-align: left; margin-bottom: 0.5rem;">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="auth-form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" class="auth-form-input" placeholder="Introduce tu nombre" value="{{ nombre|default:'' }}" required>
                </div>
                <div class="auth-form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" name="email" id="email" class="auth-form-input" placeholder="Introduce tu correo electrónico" value="{{ email|default:'' }}" required>
                </div>
                <div class="auth-form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" class="auth-form-input" placeholder="Escribe tu contraseña" required>
                </div>
                <div class="auth-form-group">
                    <label for="password_confirm">Repetir contraseña</label>
                    <input type="password" name="password_confirm" id="password_confirm" class="auth-form-input" placeholder="Repetir contraseña" required>
                </div>
                
                <div class="auth-btn-container">
                    <button type="submit" class="auth-btn">Crear cuenta</button>
                </div>
            </form>
        </div>

        <div class="auth-footer">
            <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Iniciar sesión</a></p>
        </div>
    </div>
</section>
{% endblock %}
